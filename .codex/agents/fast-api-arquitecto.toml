# INSTRUCCIÓN CRÍTICA\r
Para programar, auditar o estructurar código en el proyecto, carga y aplica la skill `fastapi-architecture`. No generes código sin validar su checklist técnico.\r
\r
## Búsqueda obligatoria ANTES de escribir código\r
Antes de implementar cualquier funcionalidad:\r
\r
1. **Revisar la carpeta `/src/utilities/`** — Aquí hay funciones compartidas (security, jwt_required, etc.)\r
   - `security.py`: `hash_password()`, `verify_password()`, `password_validate()`\r
   - `jwt_required.py`: `obtener_usuario_actual()`, `jwt_token_requerido`\r
   - No duplicar lógica que ya existe aquí\r
\r
2. **Revisar si existe un modelo o servicio similar** en `/src/models/` y `/src/services/`\r
\r
3. **Revisar el schema correspondiente** en `/src/schemas/`\r
\r
4. **Revisar módulo ML** en `/src/ml/` — YOLO, tracking y clasificación SCA\r
   - `inference.py`: `CoffeeRenInference` — carga modelo YOLO, realiza predicción\r
   - `tracker.py`: `CoffeeRenTracker` — ByteTrack, conteo de granos únicos, dibujo de BBoxes\r
   - `classifier.py`: `generar_reporte()` — cálculo de grados SCA (solo 3: Specialty/2/3)\r
   - **Integración**: Los servicios en `/src/services/` (como `tracker_service.py`) orquestan estos módulos\r
   - **No modificar directamente desde rutas**: Siempre pasar por un servicio intermedio\r
\r
**No generes código repetido o fragmentado. Reutiliza siempre.**\r
\r
---\r
\r
## Arquitectura de 4 capas + Módulo ML\r
\r
```\r
Rutas HTTP\r
   ↓ (obtener_usuario_actual())\r
Servicios (orquestación, transacciones)\r
   ├─ Llaman Modelos (SQL)\r
   └─ Llaman Módulo ML (/src/ml/)\r
        ├─ CoffeeRenInference (YOLO prediction)\r
        ├─ CoffeeRenTracker (ByteTrack + drawing)\r
        └─ classifier.generar_reporte() (SCA grados)\r
   ↓\r
Schemas (Pydantic validación)\r
```\r
\r
### Flujo Ejemplo: Streaming de video con defectos\r
\r
```\r
POST /video/iniciar\r
  ↓\r
tracker_service.iniciar()\r
  ├─ camara_service.iniciar() → captura frames @ 1280×720 60fps\r
  ├─ CoffeeRenTracker.procesar_frame() → YOLO + ByteTrack\r
  └─ Loop: obtiene /lote/conteo → tracker.obtener_conteo()\r
  \r
GET /video/stream → MJPEG con defectos en ROJO\r
\r
POST /lote/generar-reporte\r
  ↓\r
tracker_service.generar_reporte_lote()\r
  ↓\r
classifier.generar_reporte(conteo_actual)\r
  → {grado: "Specialty", defectos: 8.4, apto: true}\r
```"""
