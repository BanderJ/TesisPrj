{% extends "main.html" %}

{% block style %}
<link rel="stylesheet" href="/static/css/analisis.css">
{% endblock %}

{% block content %}
<section class="analisis-page" id="analisisPage">

	<div class="analisis-toolbar">
		<div class="analisis-toolbar-title">
			<svg class="analisis-toolbar-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
				<rect x="3" y="3" width="18" height="18" rx="3"/>
				<path d="M9 9h1m5 0h1M9 12h6M9 15h4"/>
			</svg>
			<h1>Resumen del análisis</h1>
		</div>
		<div class="analisis-toolbar-actions">
			<button class="btn-export pdf" onclick="window.print()">
				<img src="/static/icon/pdf.png" alt="">
				Exportar PDF
			</button>
			<button class="btn-export excel" id="btnExcel">
				<img src="/static/icon/excel.png" alt="">
				Exportar Excel
			</button>
		</div>
	</div>

	{% set modo = 'analisis' %}
	{% include "partials/resumen_evaluacion.html" %}

	<div class="analisis-actions">
		<button type="button" onclick="window.location.replace('/')" class="btn-export btn-neutral">
			Ir al inicio
		</button>
		<button type="button" onclick="window.location.replace('/registro')" class="btn-export btn-primary-soft">
			Nueva evaluación
		</button>
	</div>

</section>
{% endblock %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>const EVALUACION_ID = '{{ evaluacion_id }}';</script>
<script src="/static/js/eventos-monitoreo.js"></script>
<script src="/static/js/resumen-evaluacion.js"></script>
<script src="/static/js/analisis.js"></script>
{% endblock %}
