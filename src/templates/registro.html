{% extends "main.html" %}

{% block style %}
	<link rel="stylesheet" href="/static/css/registro.css">
{% endblock %}

{% block content %}
<section class="registro-page" aria-label="Registro de muestra de cafe">
	<div class="registro-header card">
		<p class="kicker info-text">Captura de muestra</p>
		<h1>Registro de muestra</h1>
		<p class="info-text">Completa la ficha tecnica para iniciar clasificacion. El monitoreo se abrira en una vista dedicada.</p>
	</div>

	<form id="registroForm" class="registro-form" novalidate>
		<div class="registro-grid">
			<article class="card registro-card" aria-labelledby="lote-title">
				<h2 id="lote-title">Datos del caficultor</h2>

				<div class="field-group">
					<label for="tipoDocumento">Tipo documento</label>
					<select id="tipoDocumento" name="tipoDocumento" required>
						<option value="" disabled selected>Seleccionar un tipo</option>
					</select>
				</div>

				<div class="field-group">
					<label for="numDocumento">Número de documento</label>
					<input id="numDocumento" name="numDocumento" type="text" maxlength="12" required placeholder="Ingrese documento">
					<!-- <p id="docHint" class="helper-text info-text">Selecciona primero el tipo de documento.</p> -->
					<p id="caficultorLookupMessage" class="helper-text info-text" aria-live="polite"></p>
				</div>

				<div class="field-group">
					<label for="nombreCaficultor">Nombre del caficultor</label>
					<input id="nombreCaficultor" name="nombreCaficultor" type="text" required placeholder="Ejemplo: Juan Perez" readonly>
				</div>

				<div class="field-group">
					<label for="tipoCaficultor">Tipo de caficultor</label>
					<input id="tipoCaficultor" name="tipoCaficultor" type="text" required placeholder="Ejemplo: Socio" readonly>
				</div>
			</article>

			<article class="card registro-card" aria-labelledby="peso-title">
				<h2 id="peso-title">Pesos de granos</h2>

				<div class="field-group">
					<label for="tamiz">Numero de tamiz (mm)</label>
					<input id="tamiz" name="tamiz" type="number" min="0" step="0.1" required placeholder="Ejemplo: 6.5">
				</div>

				<div class="field-group">
					<label for="pesoTotal">Peso total de muestra (g)</label>
					<input id="pesoTotal" name="pesoTotal" type="number" min="0" step="0.1" required placeholder="Ejemplo: 1200">
				</div>

				<div class="field-group">
					<label for="pesoTrillados">Peso de granos trillados (g)</label>
					<input id="pesoTrillados" name="pesoTrillados" type="number" min="0" step="0.1" required placeholder="Ejemplo: 930">
				</div>

				<div class="field-group">
					<label for="pesoTamizados">Peso de granos tamizados (g)</label>
					<input id="pesoTamizados" name="pesoTamizados" type="number" min="0" step="0.1" required placeholder="Ejemplo: 870">
				</div>
			</article>
		</div>

		<div class="action-row">
			<button type="button" id="clearFormBtn" class="btn btn-outline">Limpiar formulario</button>
			<button type="button" id="startMonitoringBtn" class="btn btn-primary">Iniciar clasificacion y monitoreo</button>
		</div>
	</form>
</section>

<script>
	(() => {
		const form = document.getElementById('registroForm');
		const tipoDocumentoSelect = document.getElementById('tipoDocumento');
		const numDocumentoInput = document.getElementById('numDocumento');
		const nombreCaficultorInput = document.getElementById('nombreCaficultor');
		const tipoCaficultorInput = document.getElementById('tipoCaficultor');
		const docHint = document.getElementById('docHint');
		const caficultorLookupMessage = document.getElementById('caficultorLookupMessage');
		const startBtn = document.getElementById('startMonitoringBtn');
		const clearBtn = document.getElementById('clearFormBtn');

		const tiposDocumento = new Map();
		let consultaTimer = null;
		let caficultorValido = false;
		let ultimaClaveBusqueda = '';

		function normalizarTexto(valor) {
			return valor
				.normalize('NFD')
				.replace(/[̀-ͯ]/g, '')
				.toLowerCase()
				.trim();
		}

		function obtenerReglaDocumento(tipoDocumentoSeleccionadoId) {
			const id = Number(tipoDocumentoSeleccionadoId || 0);
			const nombreTipo = normalizarTexto(tiposDocumento.get(id) || '');

			if (nombreTipo === 'dni') {
				return {
					maxLength: 8,
					soloNumeros: true,
					hint: 'DNI: exactamente 8 digitos numericos.',
					placeholder: 'Ingrese 8 digitos de DNI',
					validationMessage: 'Para DNI se requieren 8 digitos numericos.',
					regex: /^\d{8}$/,
					longitudesAutoBusqueda: [8],
				};
			}

			if (nombreTipo === 'pasaporte' || nombreTipo === 'carnet de extranjeria') {
				return {
					maxLength: 12,
					soloNumeros: false,
					hint: 'Pasaporte/Carnet: exactamente 12 caracteres alfanumericos.',
					placeholder: 'Ingrese 12 caracteres',
					validationMessage: 'Para Pasaporte/Carnet se requieren 12 caracteres alfanumericos.',
					regex: /^[A-Za-z0-9]{12}$/,
					longitudesAutoBusqueda: [12],
				};
			}

			return {
				maxLength: 12,
				soloNumeros: false,
				hint: 'Documento entre 8 y 12 caracteres alfanumericos.',
				placeholder: 'Ingrese documento (8 a 12 caracteres)',
				validationMessage: 'Documento invalido. Use de 8 a 12 caracteres alfanumericos.',
				regex: /^[A-Za-z0-9]{8,12}$/,
				longitudesAutoBusqueda: [8, 12],
			};
		}

		function limpiarDocumentoSegunRegla(valor, regla) {
			const texto = String(valor || '').trim();
			if (regla.soloNumeros) {
				return texto.replace(/\D/g, '').slice(0, regla.maxLength);
			}
			return texto.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, regla.maxLength);
		}

		function validarDocumentoPorTipoId(tipoId, documento) {
			const id = Number(tipoId || 0);
			if (!id) return { ok: false, mensaje: 'Selecciona primero el tipo de documento.' };
			const regla = obtenerReglaDocumento(id);
			if (!regla.regex.test(documento)) return { ok: false, mensaje: regla.validationMessage };
			return { ok: true, mensaje: '' };
		}

		function aplicarReglaDocumento() {
			const regla = obtenerReglaDocumento(tipoDocumentoSelect.value);
			numDocumentoInput.maxLength = regla.maxLength;
			numDocumentoInput.placeholder = regla.placeholder;
			numDocumentoInput.inputMode = regla.soloNumeros ? 'numeric' : 'text';
			docHint.textContent = regla.hint;
			numDocumentoInput.value = limpiarDocumentoSegunRegla(numDocumentoInput.value, regla);
		}

		function limpiarDatosCaficultor() {
			nombreCaficultorInput.value = '';
			tipoCaficultorInput.value = '';
			caficultorValido = false;
			numDocumentoInput.setCustomValidity('');
		}

		function setLookupMessage(message, type = 'neutral') {
			caficultorLookupMessage.innerHTML = message;
			caficultorLookupMessage.classList.remove('helper-success', 'helper-error');
			if (type === 'success') caficultorLookupMessage.classList.add('helper-success');
			if (type === 'error') caficultorLookupMessage.classList.add('helper-error');
		}

		async function consultarCaficultor(documento) {
			const validacion = validarDocumentoPorTipoId(tipoDocumentoSelect.value, documento);
			if (!validacion.ok) {
				limpiarDatosCaficultor();
				setLookupMessage(validacion.mensaje, 'error');
				return;
			}

			const clave = `${tipoDocumentoSelect.value}:${documento}`;
			if (clave === ultimaClaveBusqueda && caficultorValido) return;
			ultimaClaveBusqueda = clave;

			try {
				setLookupMessage('Buscando datos del caficultor...');
				const response = await fetch(`/caficultor/consultar/${encodeURIComponent(documento)}`);

				if (!response.ok) {
					const errorData = await response.json();
					throw new Error(errorData.detail || 'No se pudo consultar el caficultor');
				}

				const payload = await response.json();

				if (!payload.encontrado || !payload.data) {
					limpiarDatosCaficultor();
					setLookupMessage((payload.mensaje || 'Caficultor no encontrado.') + ' <a href="/nuevo-caficultor" style="text-decoration:underline;">Registrar caficultor</a>', 'error');
					return;
				}

				nombreCaficultorInput.value = payload.data.nombre_completo;
				tipoCaficultorInput.value = payload.data.tipo_caficultor;
				caficultorValido = true;
				numDocumentoInput.setCustomValidity('');
				setLookupMessage(payload.mensaje || 'Caficultor encontrado.', 'success');
			} catch (error) {
				limpiarDatosCaficultor();
				setLookupMessage(error.message || 'Error al consultar el caficultor.', 'error');
			}
		}

		function intentarBusquedaAutomatica() {
			const tipoId = Number(tipoDocumentoSelect.value || 0);
			const regla = obtenerReglaDocumento(tipoId);
			const documento = limpiarDocumentoSegunRegla(numDocumentoInput.value, regla);
			numDocumentoInput.value = documento;

			if (!tipoId) {
				limpiarDatosCaficultor();
				setLookupMessage(documento.length > 0 ? 'Selecciona primero el tipo de documento.' : '', documento.length > 0 ? 'error' : 'neutral');
				return;
			}

			if (!regla.longitudesAutoBusqueda.includes(documento.length)) {
				limpiarDatosCaficultor();
				setLookupMessage(documento.length > 0 ? regla.hint : '');
				return;
			}

			if (consultaTimer) clearTimeout(consultaTimer);
			consultaTimer = setTimeout(() => consultarCaficultor(documento), 300);
		}

		async function cargarTiposDocumento() {
			try {
				const response = await fetch('/tipo-documento/listar');
				if (!response.ok) throw new Error('No se pudo obtener tipos de documento');

				const tipos = await response.json();
				const placeholder = tipoDocumentoSelect.querySelector('option[value=""]');
				tipoDocumentoSelect.innerHTML = '';
				tipoDocumentoSelect.appendChild(placeholder);

				const fragment = document.createDocumentFragment();
				for (const tipo of tipos) {
					const id = Number(tipo.id);
					tiposDocumento.set(id, String(tipo.nombre));
					const option = document.createElement('option');
					option.value = String(id);
					option.textContent = tipo.nombre;
					fragment.appendChild(option);
				}
				tipoDocumentoSelect.appendChild(fragment);

				const entryDni = [...tiposDocumento.entries()].find(
					([, nombre]) => normalizarTexto(nombre) === 'dni'
				);
				if (entryDni) tipoDocumentoSelect.value = String(entryDni[0]);

				aplicarReglaDocumento();
			} catch (error) {
				console.error(error);
			}
		}

		function guardarMuestraPendiente() {
			const payload = {
				tipoDocumentoId: tipoDocumentoSelect.value,
				tipoDocumentoNombre: tipoDocumentoSelect.options[tipoDocumentoSelect.selectedIndex]?.text || '',
				numDocumento: numDocumentoInput.value.trim(),
				nombreCaficultor: nombreCaficultorInput.value.trim(),
				tipoCaficultor: tipoCaficultorInput.value.trim(),
				tamiz: document.getElementById('tamiz').value,
				pesoTotal: document.getElementById('pesoTotal').value,
				pesoTrillados: document.getElementById('pesoTrillados').value,
				pesoTamizados: document.getElementById('pesoTamizados').value,
				fechaRegistro: new Date().toISOString()
			};
			sessionStorage.setItem('coffeeren.pendingSample', JSON.stringify(payload));
		}

		function clearAll() {
			form.reset();
			limpiarDatosCaficultor();
			setLookupMessage('');
			ultimaClaveBusqueda = '';
			aplicarReglaDocumento();
		}

		function validateForm() {
			const requiredFields = form.querySelectorAll('input[required], select[required]');
			for (const field of requiredFields) {
				if (!field.value.trim()) {
					field.reportValidity();
					return false;
				}
			}
			if (!caficultorValido) {
				numDocumentoInput.setCustomValidity('Debe consultar y validar un caficultor registrado para continuar');
				numDocumentoInput.reportValidity();
				numDocumentoInput.setCustomValidity('');
				return false;
			}
			return true;
		}

		tipoDocumentoSelect.addEventListener('change', () => {
			aplicarReglaDocumento();
			ultimaClaveBusqueda = '';
			limpiarDatosCaficultor();
			setLookupMessage('');
			if (numDocumentoInput.value) intentarBusquedaAutomatica();
		});

		numDocumentoInput.addEventListener('input', () => {
			numDocumentoInput.setCustomValidity('');
			ultimaClaveBusqueda = '';
			limpiarDatosCaficultor();
			intentarBusquedaAutomatica();
		});

		startBtn.addEventListener('click', () => {
			if (validateForm()) {
				guardarMuestraPendiente();
				window.location.href = '/monitoreo';
			}
		});

		clearBtn.addEventListener('click', clearAll);

		cargarTiposDocumento();
	})();
</script>
{% endblock %}
