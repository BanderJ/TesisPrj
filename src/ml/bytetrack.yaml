tracker_type: bytetrack
track_high_thresh: 0.20   # asociacion primera pasada — bajado para no perder granos que se tocan
track_low_thresh: 0.05    # banda de baja confianza que sostiene el track en aglomeracion
new_track_thresh: 0.20    # confianza minima para iniciar un track nuevo
track_buffer: 10          # calibrado — el contador global hace el conteo resistente a pausas
match_thresh: 0.8
fuse_score: True
